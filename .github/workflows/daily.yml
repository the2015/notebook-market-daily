name: notebook-market-daily

on:
  schedule:
    # 每天 01:10 UTC（北京时间 09:10）；避开整点，减少高负载排队被丢弃的概率
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      jd_sku_ids:
        description: "可选：京东 SKU ID，逗号分隔，如 100012043978,100015889346"
        required: false
        default: ""

# 最小权限：只读。防止 workflow 内容被篡改后获得写权限
permissions:
  contents: read

concurrency:
  group: notebook-market-daily
  cancel-in-progress: true

jobs:
  report:
    # 必须用 ubuntu-latest：
    #   - larger runner 对公开仓库同样计费，且需 Team/Enterprise 套餐，禁用
    #   - Windows runner 单价是 Linux 的 5 倍，macOS 高 30 倍，均不使用
    runs-on: ubuntu-latest
    # 计费防护：单次运行最长 5 分钟即强制终止，避免异常情况下一路烧额度
    timeout-minutes: 5
    # 仅允许本账号仓库触发，fork 的 pull_request 不触发（本次未开 PR 触发器，此为冗余保险）
    if: github.repository_owner == 'the2015'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect market data
        env:
          JD_SKU_IDS: ${{ inputs.jd_sku_ids }}
        run: bash scripts/collect.sh

      - name: Notify WeChat
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          REPORT: out/report.md
        run: bash scripts/notify.sh

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-report
          path: out/report.md
          # 存储防护：报告仅 2KB 量级，保留 1 天足够复查，避免长期累积占用额度
          retention-days: 1
